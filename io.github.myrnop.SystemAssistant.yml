app-id: io.github.myrnop.SystemAssistant
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: systemassistant

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=host:ro

modules:
  - name: systemassistant
    buildsystem: simple
    build-commands:
      - install -Dm755 system_assistant.py /app/bin/systemassistant
      - install -Dm644 io.github.myrnop.SystemAssistant.desktop /app/share/applications/io.github.myrnop.SystemAssistant.desktop
      - install -Dm644 io.github.myrnop.SystemAssistant.metainfo.xml /app/share/metainfo/io.github.myrnop.SystemAssistant.metainfo.xml
      - install -Dm644 io.github.myrnop.SystemAssistant.png /app/share/icons/hicolor/512x512/apps/io.github.myrnop.SystemAssistant.png
    sources:
      - type: dir
        path: .
